<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/lumiere-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PyME-Sync - Sistema Móvil de Gestión de Inventario para pequeñas y medianas empresas.">

  <!-- Precarga de scripts para reducir tiempo de bloqueo -->
  <link rel="preload" href="flutter.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PyME-Sync">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="theme-color" content="#121212">

  <title>PyME-Sync - Sistema Móvil de Gestión de Inventario</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #121212;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Script principal de Flutter (sin defer para asegurar orden de carga) -->
  <script src="flutter.js"></script>
</head>
<body>
  <!-- Indicador visual mientras carga el Javascript -->
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <p>Cargando PyME-Sync...</p>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Descarga e inicialización estándar de Flutter Web
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: typeof serviceWorkerVersion !== 'undefined' ? serviceWorkerVersion : null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            // Elimina la pantalla de carga tan pronto como arranca Flutter
            var loadingEl = document.getElementById('loading');
            if (loadingEl) {
              loadingEl.remove();
            }
            return appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
