<!DOCTYPE html>
<html>
<head>
  <base href="/lumiere-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PyME-Sync - Sistema Móvil de Gestión de Inventario y Ventas en Tiempo Real">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Resource Hints para acelerar conexiones a servicios externos (Firebase / Fuentes) -->
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload para precargar recursos críticos antes de la ejecución -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PyME-Sync">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PyME-Sync</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 
    Atributo 'defer' para ejecutar el script de arranque después del parseo del HTML
    sin bloquear el renderizado inicial de la pantalla
  -->
  <script defer src="flutter_bootstrap.js"></script>
</body>
</html>
